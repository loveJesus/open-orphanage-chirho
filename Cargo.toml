# For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life.
[package]
name = "open-orphanage-chirho"
version = "0.1.0"
edition = "2021"
description = "OpenOrphanageChirho - A platform for managing orphanages and child sponsorship"

[dependencies]
worker = { version = "0.5.0", features = ["d1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.7.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9.2.0"
argon2 = { version="0.5.3" , features = ["default"]}
wasm-bindgen = { version = "~0.2.100", features = ["serde-serialize"] }
wasm-bindgen-futures = "~0.4.50"
regex = "~1.11.1"
rand_core = { version="0.6.4", features = ["getrandom"] }
web-sys = { version = "~0.3.77", features = [
    "Headers",
    "Request",
    "Response",
    "Window",
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "Node",
    "Window",
    "ResponseType"
]}
password-hash = { version = "0.5"}

[dev-dependencies]
tokio-test = "~0.4.4"
mockall = "~0.12.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
