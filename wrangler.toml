# For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life.
name = "open-orphanage-chirho"
main = "src/lib.rs"
compatibility_date = "2024-01-01"

[build]
command = "cargo build --target wasm32-unknown-unknown"
cargo_manifest = "Cargo.toml"
watch_dir = "src"

[build.upload]
format = "service-worker"

[vars]
ENVIRONMENT_CHIRHO = "development"

[[d1_databases]]
binding = "DB_CHIRHO"
database_name = "open_orphanage_chirho_db"
database_id = "6082da09-35c1-4a2b-b221-061cf7762d25"

[env.production]
name = "open-orphanage-chirho-prod"
route = "api.openorphanagechirho.com/*"
vars = { ENVIRONMENT_CHIRHO = "production" }

[env.staging]
name = "open-orphanage-chirho-staging"
route = "staging-api.openorphanagechirho.com/*"
vars = { ENVIRONMENT_CHIRHO = "staging" } 